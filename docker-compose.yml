version: '3.8'

services:
  # 服務 1：React 前端平台
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: work_tracker_platform
    ports:
      - "8088:80"
    depends_on:
      - firebase
    restart: always
    extra_hosts:
      - "host.docker.internal:192.168.146.160"

  # 服務 2：Firebase 地端模擬器
  firebase:
    build:
      context: .
      dockerfile: Dockerfile.firebase
    container_name: firebase_local_emulator
    stop_grace_period: 40s
    ports:
      - "4000:4000"  # Emulator UI
      - "8181:8181"  # 依照要求改為 8181，避開宿主機 8080 衝突
      - "9099:9099"  # Auth
      - "9150:9150"  # Firestore UI WebSocket 資料串流
    volumes:
      - ./firebase-data:/app/data
    restart: always

networks:
  default:
    name: tracker_network