services:
  # 服務 1：React 前端平台
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: work_tracker_platform
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: always

  # 服務 2：Express + Socket.io 後端
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: work_tracker_backend
    ports:
      - "3001:3001"
    environment:
      - MONGO_URI=mongodb://mongo:27017/worktracker
    depends_on:
      - mongo
    restart: always

  # 服務 3：MongoDB 資料庫
  mongo:
    image: mongo:7
    container_name: work_tracker_mongo
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
    restart: always

networks:
  default:
    name: tracker_network
