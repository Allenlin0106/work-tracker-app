services:
  # 前端：React (Vite) 建置 + Nginx 反向代理
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: work_tracker_platform
    ports:
      - "8088:443"
      - "8089:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    restart: always

# 注意：ASP.NET Core 後端（backend/WorkTracker/）目前以 IIS Express 本機開發。
# 正式部署時請另行建立 Dockerfile（FROM mcr.microsoft.com/dotnet/aspnet:8.0）
# 並將 backend 服務加回此檔案，同時調整 nginx.conf proxy_pass 目標。

networks:
  default:
    name: tracker_network
