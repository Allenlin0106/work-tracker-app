services:
  # 服務 1：React 前端平台
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: work_tracker_platform
    ports:
      - "8088:443"
      - "8089:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: always

  # 服務 2：Express + Socket.io 後端（連線至外部 SQL Server）
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: work_tracker_backend
    secrets:
      - encryption_key
    environment:
      - ENCRYPTED_SQL_PASSWORD=${ENCRYPTED_SQL_PASSWORD}
      - ENCRYPTED_JWT_SECRET=${ENCRYPTED_JWT_SECRET}
      - SQL_SERVER=${SQL_SERVER}
      - SQL_PORT=${SQL_PORT:-1433}
      - SQL_DATABASE=${SQL_DATABASE}
      - SQL_USER=${SQL_USER}
      - SQL_ENCRYPT=${SQL_ENCRYPT:-false}
      - SQL_TRUST_CERT=${SQL_TRUST_CERT:-true}
      - CORS_ORIGIN=${CORS_ORIGIN}
    restart: always

# 加密金鑰以 Docker Compose secrets bind-mount 進容器，不出現在 docker inspect Env 欄位
secrets:
  encryption_key:
    file: ./secrets/encryption_key.txt

networks:
  default:
    name: tracker_network
