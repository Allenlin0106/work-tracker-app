services:
  # 服務 1：React 前端平台
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: work_tracker_platform
    ports:
      - "8088:443"
      - "8089:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: always

  # 服務 2：Express + Socket.io 後端（僅內部網路存取）
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: work_tracker_backend
    environment:
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongo:27017/worktracker?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - mongo
    restart: always

  # 服務 3：MongoDB 資料庫（僅內部網路存取，不對外暴露 port）
  mongo:
    image: mongo:7
    container_name: work_tracker_mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS}
    volumes:
      - ./mongo-data:/data/db
    restart: always

networks:
  default:
    name: tracker_network
