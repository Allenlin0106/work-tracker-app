services:
  # ASP.NET Core 後端 + Blazor WASM 靜態檔案（單一容器）
  app:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: work_tracker_app
    expose:
      - "80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      # 正式環境請以環境變數或 secrets 覆蓋下列設定
      # - App__SqlConnectionString=Server=...
      # - App__JwtSecret=...
    restart: always

  # Nginx：SSL 終止 + 反向代理至 ASP.NET Core
  nginx:
    image: nginx:stable-alpine
    container_name: work_tracker_nginx
    ports:
      - "8088:443"
      - "8089:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: always

networks:
  default:
    name: tracker_network
