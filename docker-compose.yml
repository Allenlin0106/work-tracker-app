services:
  # 服務 1：React 前端平台
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: work_tracker_platform
    ports:
      - "8088:443"
      - "8089:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: always

  # 服務 2：Express + Socket.io 後端（連線至外部 MongoDB）
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: work_tracker_backend
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
    restart: always

networks:
  default:
    name: tracker_network
